name: lca-codex-qualification

services:
  mysql-qualification:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${QUALIFICATION_MYSQL_DATABASE:-lca_codex_qualification}
      MYSQL_USER: ${QUALIFICATION_MYSQL_USER:-lca_qualification}
      MYSQL_PASSWORD: ${QUALIFICATION_MYSQL_PASSWORD:?QUALIFICATION_MYSQL_PASSWORD requis}
      MYSQL_ROOT_PASSWORD: ${QUALIFICATION_MYSQL_ROOT_PASSWORD:?QUALIFICATION_MYSQL_ROOT_PASSWORD requis}
    ports:
      - "127.0.0.1:${QUALIFICATION_MYSQL_PORT:-33306}:3306"
    volumes:
      - qualification_mysql_data:/var/lib/mysql
      - ./deploy/mysql.cnf:/etc/mysql/conf.d/lca.cnf:ro
      - ./backend-node/database/baseline/001_initial_schema.sql:/docker-entrypoint-initdb.d/001-initial-schema.sql:ro
      - ./backend-node/database/seeds/001_system_seed.sql:/docker-entrypoint-initdb.d/002-system-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [qualification_private]

  backend-qualification:
    build: { context: ./backend-node, dockerfile: Dockerfile }
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: http://127.0.0.1:${QUALIFICATION_HTTP_PORT:-38080}
      DB_HOST: mysql-qualification
      DB_PORT: 3306
      DB_USER: ${QUALIFICATION_MYSQL_USER:-lca_qualification}
      DB_PASSWORD: ${QUALIFICATION_MYSQL_PASSWORD:?QUALIFICATION_MYSQL_PASSWORD requis}
      DB_NAME: ${QUALIFICATION_MYSQL_DATABASE:-lca_codex_qualification}
      JWT_ACCESS_SECRET: ${QUALIFICATION_JWT_ACCESS_SECRET:?QUALIFICATION_JWT_ACCESS_SECRET requis}
      JWT_REFRESH_SECRET: ${QUALIFICATION_JWT_REFRESH_SECRET:?QUALIFICATION_JWT_REFRESH_SECRET requis}
      TWO_FACTOR_ENCRYPTION_KEY: ${QUALIFICATION_TWO_FACTOR_ENCRYPTION_KEY:?QUALIFICATION_TWO_FACTOR_ENCRYPTION_KEY requis}
      PROVIDER_PAYMENT_ENCRYPTION_KEY: ${QUALIFICATION_PROVIDER_PAYMENT_ENCRYPTION_KEY:?QUALIFICATION_PROVIDER_PAYMENT_ENCRYPTION_KEY requis}
      ADMIN_EMAIL: ${QUALIFICATION_ADMIN_EMAIL:-codex-admin@qualification.invalid}
      ADMIN_PASSWORD: ${QUALIFICATION_ADMIN_PASSWORD:?QUALIFICATION_ADMIN_PASSWORD requis}
      TRUST_PROXY_HOPS: 0
      UPLOAD_DIR: /app/qualification-uploads
      GED_STORAGE_DIR: /app/qualification-ged
      DATABASE_ROOT: /app/database
    volumes:
      - qualification_uploads:/app/qualification-uploads
      - qualification_ged:/app/qualification-ged
      - ./backend-node/database:/app/database:ro
    command: ["sh", "-c", "node dist/scripts/database-bootstrap.js && node dist/scripts/seed-admin.js && node dist/server.js"]
    depends_on:
      mysql-qualification: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [qualification_private]

  frontend-qualification:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args: { VITE_API_URL: /api }
    ports:
      - "127.0.0.1:${QUALIFICATION_HTTP_PORT:-38080}:80"
    volumes:
      - ./frontend/nginx/qualification.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-qualification: { condition: service_healthy }
    networks: [qualification_private, qualification_public]

networks:
  qualification_private: { internal: true }
  qualification_public:

volumes:
  qualification_mysql_data:
  qualification_uploads:
  qualification_ged:
