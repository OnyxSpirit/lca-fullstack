name: lca-recette

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports: ["127.0.0.1:${MYSQL_PORT}:3306"]
    volumes:
      - recette_mysql_data:/var/lib/mysql
      - ./deploy/mysql.cnf:/etc/mysql/conf.d/lca.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [recette_private, recette_host]

  backend:
    build: { context: ./backend-node, dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: http://127.0.0.1:${FRONTEND_PORT}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UPLOAD_DIR: /app/uploads
      GED_STORAGE_DIR: /app/ged-storage
      DATABASE_ROOT: /app/database
    ports: ["127.0.0.1:${BACKEND_PORT}:3001"]
    volumes:
      - recette_uploads_data:/app/uploads
      - recette_ged_data:/app/ged-storage
      - ./backend-node/database:/app/database:ro
    command: ["sh", "-c", "node dist/scripts/database-bootstrap.js && node dist/server.js"]
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [recette_private, recette_host]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args: { VITE_API_URL: /api }
    restart: unless-stopped
    ports: ["127.0.0.1:${FRONTEND_PORT}:80"]
    depends_on:
      backend: { condition: service_healthy }
    networks: [recette_private, recette_host]

  seed-admin:
    profiles: [tools]
    build: { context: ./backend-node, dockerfile: Dockerfile }
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATABASE_ROOT: /app/database
    command: ["node", "dist/scripts/seed-admin.js"]
    volumes: ["./backend-node/database:/app/database:ro"]
    depends_on:
      mysql: { condition: service_healthy }
    networks: [recette_private]

networks:
  recette_private: { internal: true }
  recette_host: {}

volumes:
  recette_mysql_data: { name: lca_recette_mysql_data }
  recette_uploads_data: { name: lca_recette_uploads_data }
  recette_ged_data: { name: lca_recette_ged_data }
